<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чамд зориулав 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Great+Vibes&family=M+PLUS+Rounded+1c:wght@500;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="content.js"></script>
<style>
  :root {
    --title: 'M PLUS Rounded 1c', 'Nunito', sans-serif;
    --script: 'Bad Script', cursive;
    --crimson: #a3123f;
    --rose: #d6336c;
    --sky: radial-gradient(ellipse 75% 38% at 28% 100%, #97cc74 60%, transparent 61%),
           radial-gradient(ellipse 90% 42% at 82% 106%, #b3db8b 60%, transparent 61%),
           linear-gradient(#b9ddf4, #eaf6fc 72%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Nunito', sans-serif; color: #4a1a2a; overflow: hidden; background: #fdeef0; }
  button { font: inherit; cursor: pointer; }

  .screen {
    position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden;
    opacity: 0; visibility: hidden; transition: opacity .7s, visibility 0s .7s;
  }
  .screen.active { opacity: 1; visibility: visible; transition: opacity .7s; }
  .inner {
    position: relative; min-height: 100%; padding: 20px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .deco { position: absolute; pointer-events: none; }

  .btn-next {
    font-family: var(--title); font-weight: 800; font-size: clamp(.95rem, 1.6vw, 1.15rem);
    color: var(--rose); background: #fff8f8; border: 2px solid #f2b8c6; border-radius: 999px;
    padding: 9px 28px; box-shadow: 0 3px 0 #f2c9d3; white-space: nowrap;
  }
  .btn-next:active { transform: translateY(2px); box-shadow: 0 1px 0 #f2c9d3; }

  .rv { opacity: 0; }
  .screen.active .rv { animation: rise .8s ease both; animation-delay: calc(var(--i, 0) * .22s); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .wc {
    background:
      radial-gradient(ellipse 60% 50% at 15% 20%, rgba(255,255,255,.55), transparent 70%),
      radial-gradient(ellipse 50% 60% at 85% 25%, rgba(240,150,175,.35), transparent 70%),
      radial-gradient(ellipse 70% 50% at 30% 85%, rgba(238,140,165,.35), transparent 70%),
      radial-gradient(ellipse 50% 50% at 80% 80%, rgba(255,240,244,.6), transparent 70%),
      #f6d0d8;
  }

  /* ---------- 1. Love meter ---------- */
  #s-meter { background: #fdeef0; }
  .deco-plane { left: 1%; bottom: 1%; width: clamp(110px, 18vw, 240px); }
  .deco-ghosts { top: 2%; right: 2%; width: clamp(70px, 11vw, 140px); }
  .cat-wrap { position: relative; width: clamp(130px, 20vw, 200px); }
  .cat { width: 100%; display: block; }
  .cat.pop { animation: pop .35s; }
  @keyframes pop { 40% { transform: scale(1.08) rotate(-3deg); } }
  .cat .f, .cat .c-stress, .cat .c-shade { display: none; }
  .cat[data-mood="neutral"] .f-neutral, .cat[data-mood="cry"] .f-cry, .cat[data-mood="grumpy"] .f-grumpy,
  .cat[data-mood="grumpy"] .c-stress, .cat[data-mood="grumpy"] .c-shade,
  .cat[data-mood="sad"] .f-sad, .cat[data-mood="happy"] .f-happy { display: inline; }
  .ln { fill: none; stroke: #2b2b2b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .burst { position: absolute; inset: -10% -45%; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .burst.on { opacity: 1; }
  .burst svg { position: absolute; width: 22px; animation: bob 1.6s ease-in-out infinite; }
  .mood {
    font-family: var(--title); font-weight: 800; color: #9d1741; margin: 10px 0 0;
    font-size: clamp(1.35rem, 3.2vw, 2.1rem); text-align: center;
  }
  .pct-row { height: clamp(3rem, 7vh, 4rem); display: flex; align-items: center; justify-content: center; }
  .pct { font-family: var(--title); font-weight: 800; color: #c2185b; font-size: clamp(1.6rem, 3.6vw, 2.4rem); }
  .hidden { display: none !important; }
  .gauge { width: min(380px, 84vw); display: block; }
  .love-word { font-family: 'Great Vibes', cursive; font-size: 50px; fill: var(--crimson); }
  #slider {
    -webkit-appearance: none; appearance: none; width: min(430px, 82vw); height: 5px; margin: 14px 0 0;
    border-radius: 5px; background: #f3c6cf; outline: none; position: relative; z-index: 2;
  }
  #slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--rose); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.25);
  }
  #slider::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%; background: var(--rose);
    border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.25);
  }
  .hint { color: #c98396; font-size: .85rem; margin-top: 10px; }

  /* ---------- 2. Gifts ---------- */
  .big-title {
    font-family: var(--title); font-weight: 800; color: #ea5d8e; margin: 0; text-align: center;
    font-size: clamp(2rem, 6.4vw, 4.4rem); line-height: 1.15; text-shadow: 0 3px 0 rgba(255,255,255,.55);
  }
  .subtitle { font-family: var(--title); font-weight: 800; color: #b35c78; margin: 12px 0 0; text-align: center; font-size: clamp(1rem, 2.2vw, 1.5rem); }
  .gifts { display: flex; gap: clamp(10px, 5vw, 110px); justify-content: center; align-items: flex-end; margin-top: clamp(24px, 7vh, 70px); }
  .gift { background: none; border: 0; padding: 0; width: clamp(92px, 25vw, 230px); }
  .gift svg { display: block; width: 100%; filter: drop-shadow(0 8px 10px rgba(160,70,100,.18)); }
  .gift:not(.opened) svg { animation: bob 2.6s ease-in-out infinite; animation-delay: var(--d); }
  .gift.opening svg { animation: giftOpen .5s forwards; }
  @keyframes bob { 50% { transform: translateY(-7px) rotate(-2deg); } }
  @keyframes giftOpen { to { transform: scale(1.35); opacity: 0; } }

  /* ---------- 3. Bouquet ---------- */
  #s-bouquet { background-color: #f5cbd2; }
  .lace {
    width: clamp(110px, 18vw, 230px); aspect-ratio: 1;
    background:
      radial-gradient(circle, rgba(255,255,255,.95) 0 2px, transparent 2.6px) 0 0 / 10px 10px,
      radial-gradient(circle, rgba(255,255,255,.6) 0 5px, transparent 5.6px) 5px 5px / 20px 20px;
  }
  .lace.tl { top: 0; left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); }
  .lace.br { bottom: 0; right: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .bow { font-size: clamp(34px, 5vw, 58px); }
  .bow.tl { top: 5%; left: 3%; transform: rotate(-20deg); }
  .bow.br { bottom: 4%; right: 4%; transform: rotate(15deg); }
  .hearts-bg span { position: absolute; color: #e8a0b1; font-size: clamp(14px, 2vw, 24px); }
  .bq-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; max-width: 1200px; margin-bottom: 14px; position: relative; z-index: 2; }
  .bq-head h2 { grid-column: 2; }
  .bq-head .btn-next { grid-column: 3; justify-self: end; }
  .page-title { font-family: var(--title); font-weight: 800; color: #c8587a; font-size: clamp(1.7rem, 4vw, 3rem); margin: 0; text-shadow: 0 2px 0 rgba(255,255,255,.6); }
  .bq { display: grid; grid-template-columns: 1fr auto 1fr; gap: clamp(12px, 3vw, 44px); align-items: center; width: 100%; max-width: 1200px; position: relative; z-index: 2; }
  .notes { display: flex; flex-direction: column; gap: clamp(22px, 7vh, 64px); }
  .notes.left { align-items: flex-end; }
  .notes.right { align-items: flex-start; }
  .notes.left .note:nth-child(2) { margin-right: clamp(0px, 5vw, 80px); }
  .notes.right .note:nth-child(2) { margin-left: clamp(0px, 5vw, 80px); }
  .note {
    position: relative; max-width: 290px; padding: 12px 22px;
    background: #fcecea; border: 2px solid #efc3c8; border-radius: 16px;
    box-shadow: inset 0 0 0 4px #fdf6f4, 0 3px 8px rgba(190,90,110,.12);
    font-family: var(--script); font-size: clamp(1rem, 1.7vw, 1.35rem); line-height: 1.4; color: #b4495f;
  }
  .note::after {
    content: ""; position: absolute; left: 24px; bottom: -9px; width: 16px; height: 16px;
    background: #fcecea; border-right: 2px solid #efc3c8; border-bottom: 2px solid #efc3c8;
    transform: rotate(45deg) skew(12deg, 12deg);
  }
  .bq-card { position: relative; height: min(74vh, 580px); aspect-ratio: 300 / 420; }
  .bq-card .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bq-card .bouquet { position: absolute; left: 7%; top: 7%; width: 86%; height: 88%; }

  /* ---------- 4. Memory + song ---------- */
  #s-memory { background: #f4cdd4; }
  .torn.a { right: 0; top: 0; width: 34%; height: 100%; background: #f9dfe3; clip-path: polygon(14% 0, 100% 0, 100% 100%, 6% 100%, 10% 90%, 3% 80%, 11% 70%, 4% 60%, 12% 50%, 5% 40%, 13% 30%, 6% 20%, 12% 10%); }
  .torn.b { left: 0; top: 0; width: 30%; height: 100%; background: #fae6e9; opacity: .75; clip-path: polygon(0 0, 86% 0, 92% 10%, 84% 20%, 93% 30%, 85% 40%, 94% 50%, 86% 60%, 92% 70%, 84% 80%, 91% 90%, 86% 100%, 0 100%); }
  .tickets { left: 3%; top: 3%; display: flex; flex-direction: column; gap: 4px; transform-origin: top left; z-index: 1; }
  .ticket {
    position: relative; width: max-content; padding: 10px 26px; transform: rotate(var(--r));
    background: #f2bcc6; color: #9a4a5c; font-family: Georgia, serif; text-align: center;
    -webkit-mask: radial-gradient(circle at 0 50%, transparent 8px, #000 8.5px) left / 51% 100% no-repeat,
                  radial-gradient(circle at 100% 50%, transparent 8px, #000 8.5px) right / 51% 100% no-repeat;
            mask: radial-gradient(circle at 0 50%, transparent 8px, #000 8.5px) left / 51% 100% no-repeat,
                  radial-gradient(circle at 100% 50%, transparent 8px, #000 8.5px) right / 51% 100% no-repeat;
  }
  .ticket::before { content: ""; position: absolute; inset: 5px 12px; border: 1.5px dashed #d88d9d; }
  .ticket b { display: block; letter-spacing: 2px; font-size: .95rem; }
  .ticket small { display: block; font-size: .6rem; letter-spacing: 1.5px; line-height: 1.5; }
  .flowers { left: 0; bottom: -6px; font-size: clamp(40px, 7vw, 92px); line-height: .85; z-index: 1; }
  .butterfly { top: 5%; right: 25%; font-size: clamp(34px, 5vw, 66px); z-index: 4; animation: flutter 3s ease-in-out infinite; }
  @keyframes flutter { 50% { transform: translateY(-8px) rotate(12deg); } }
  #s-memory .btn-next { position: absolute; top: 16px; right: 16px; z-index: 5; }
  .photo-frame { position: relative; z-index: 2; background: #fff; padding: clamp(8px, 1.4vw, 16px); box-shadow: 0 10px 30px rgba(160,60,90,.25); width: min(50vw, 560px); transform: rotate(-1deg); }
  .photo { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--sky); }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s; }
  .slide.on { opacity: 1; }
  .player { position: relative; z-index: 3; margin: -34px 0 0 clamp(0px, 18vw, 260px); width: min(330px, 84vw); background: rgba(255,255,255,.95); border-radius: 14px; box-shadow: 0 8px 24px rgba(160,60,90,.2); padding: 12px 16px 8px; }
  .p-video { margin: -4px -6px 10px; border-radius: 10px; overflow: hidden; height: 200px; background: #000; }
  .p-video iframe { display: block; width: 100%; height: 100%; }
  .p-top { display: flex; gap: 12px; align-items: center; }
  .p-cover { width: 48px; height: 48px; border-radius: 8px; flex: none; }
  .p-meta { flex: 1; min-width: 0; }
  .p-meta b { display: block; font-size: .85rem; color: #4a2c36; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-meta span { display: block; font-size: .75rem; color: #a07c88; }
  .p-bar { height: 4px; background: #f1dde2; border-radius: 4px; margin-top: 8px; cursor: pointer; }
  .p-bar i { display: block; height: 100%; width: 0; background: #e57a98; border-radius: 4px; }
  .p-ctrl { display: flex; justify-content: space-around; align-items: center; margin-top: 8px; }
  .p-ctrl button { background: none; border: 0; padding: 4px; color: #d9738f; display: flex; }
  .p-ctrl button svg { width: 20px; height: 20px; fill: currentColor; }
  .p-ctrl button.dim { color: #e6b3c1; }
  .p-ctrl .play { width: 38px; height: 38px; border-radius: 50%; background: #e2587f; color: #fff; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(226,88,127,.4); }

  /* ---------- 5. Letter ---------- */
  #s-letter { background: radial-gradient(ellipse at 50% 45%, #fff5f6 0%, #fae3e7 50%, #f3c4cd 100%); }
  .letter-title { align-self: flex-start; font-family: var(--title); font-weight: 800; color: #d23c6a; font-size: clamp(1.5rem, 3.6vw, 2.6rem); margin: 0 0 14px; text-shadow: 0 2px 0 #fff; position: relative; z-index: 2; }
  .paper-wrap { filter: drop-shadow(0 6px 14px rgba(150,80,90,.18)); position: relative; z-index: 1; }
  .paper {
    width: min(640px, 92vw); padding: 26px 8% 20px; line-height: 32px;
    background: repeating-linear-gradient(to bottom, transparent 0 31px, #e5d2bf 31px 32px) 0 24px, #f7ecdc;
    clip-path: polygon(2% 0, 98% 0, 100% 4%, 98.5% 9%, 100% 14%, 98% 20%, 99.5% 26%, 98% 32%, 100% 38%, 98.5% 45%, 100% 52%, 98% 58%, 99.5% 65%, 98% 72%, 100% 79%, 98.5% 86%, 100% 93%, 98% 100%, 2% 100%, 0 95%, 1.5% 88%, 0 81%, 2% 74%, .5% 67%, 2% 60%, 0 53%, 1.5% 46%, 0 39%, 2% 32%, .5% 25%, 2% 18%, 0 11%, 1.5% 5%);
  }
  .paper p { margin: 0 0 32px; font-weight: 800; color: #4b2230; font-size: clamp(.92rem, 1.5vw, 1.05rem); }
  .paper p:last-child { margin-bottom: 0; }
  .paper .sign { text-align: right; color: #e0527e; font-family: var(--title); margin: 0; }
  .let-foot { width: min(640px, 92vw); display: flex; align-items: flex-end; margin-top: 12px; position: relative; z-index: 2; }
  .let-foot .btn-next { margin-left: auto; }
  .cat-heart { width: clamp(96px, 15vw, 210px); }
  .branch { right: 2%; top: 6%; height: 80%; width: clamp(44px, 6vw, 80px); }
  @media (min-width: 900px) {
    .cat-heart { position: absolute; left: 1.5%; bottom: 0; z-index: 2; }
  }

  /* ---------- Phone ---------- */
  @media (max-width: 760px) {
    .bq { grid-template-columns: 1fr 1fr; grid-template-areas: "card card" "left right"; }
    .bq-card { grid-area: card; justify-self: center; height: auto; width: min(70vw, 320px); }
    .notes.left { grid-area: left; } .notes.right { grid-area: right; }
    .notes.left, .notes.right { align-items: stretch; gap: 20px; }
    .notes .note { margin: 0 !important; font-size: .98rem; padding: 10px 14px; }
    .bq-head { grid-template-columns: 1fr auto; }
    .bq-head h2 { grid-column: 1; }
    .bq-head .btn-next { grid-column: 2; }
    .tickets { transform: scale(.6); }
    .photo-frame { width: 86vw; margin-top: 110px; }
    .player { margin: -22px 0 0; }
    .butterfly { top: 12%; right: 8%; }
    .torn.a { width: 42%; }
    .branch, .bow.tl { display: none; }
  }
</style>
</head>
<body>

<!-- 1. Love meter -->
<section class="screen active" id="s-meter">
  <div class="inner">
    <svg class="deco deco-ghosts" viewBox="0 0 130 100" aria-hidden="true">
      <g fill="#fff" stroke="#e98fa6" stroke-width="3">
        <path d="M62 58 C62 36 42 28 26 36 C8 46 10 70 24 80 C34 88 50 88 58 80 C62 74 63 68 62 58Z"/>
        <path d="M68 58 C68 36 88 28 104 36 C122 46 120 70 106 80 C96 88 80 88 72 80 C68 74 67 68 68 58Z"/>
      </g>
      <g class="ln" style="stroke:#e07a95;stroke-width:3">
        <path d="M36 56 q5 -4 10 0"/><path d="M84 56 q5 -4 10 0"/><path d="M58 64 q4 3 0 6"/><path d="M72 64 q-4 3 0 6"/>
      </g>
      <g fill="#f7b9c6"><ellipse cx="34" cy="66" rx="6" ry="4"/><ellipse cx="96" cy="66" rx="6" ry="4"/></g>
      <path d="M65 22 C61 14 50 15 50 23 C50 30 58 34 65 40 C72 34 80 30 80 23 C80 15 69 14 65 22Z" fill="#f37d9b"/>
    </svg>

    <svg class="deco deco-plane" viewBox="0 0 240 200" aria-hidden="true">
      <g fill="none" stroke="#e58aa0" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round">
        <path d="M58 96 Q66 150 118 168 Q170 184 238 196"/>
        <path d="M150 158 C118 136 110 108 128 98 C142 90 150 102 150 110 C150 102 160 90 174 98 C192 108 184 136 150 158Z"/>
      </g>
      <path d="M8 20 L120 54 L46 72Z" fill="#fac5d1" stroke="#ea94a9" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M46 72 L60 106 L72 62Z" fill="#f3a3b7" stroke="#ea94a9" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="84" cy="52" r="3" fill="#6b3b48"/><circle cx="97" cy="56" r="3" fill="#6b3b48"/>
      <path d="M87 60 q4 4 7 0" class="ln" style="stroke:#6b3b48;stroke-width:2"/>
    </svg>

    <div class="cat-wrap">
      <div id="catHolder"></div>
      <div class="burst" id="burst"></div>
    </div>
    <h1 class="mood" id="moodText"></h1>
    <div class="pct-row">
      <div class="pct" id="pct">0%</div>
      <button class="btn-next hidden" id="meterNext"></button>
    </div>
    <svg class="gauge" viewBox="0 0 300 166" aria-hidden="true">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0 0 L10 5 L0 10Z" fill="#a3123f"/>
        </marker>
      </defs>
      <g id="segs"></g>
      <text x="150" y="126" text-anchor="middle" class="love-word" transform="rotate(-8 150 120)">love</text>
      <line id="needle" x1="150" y1="150" x2="34" y2="150" stroke="#a3123f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
      <circle cx="150" cy="150" r="9" fill="#fff" stroke="#a3123f" stroke-width="4"/>
    </svg>
    <input type="range" id="slider" min="0" max="110" value="0" aria-label="love">
  </div>
</section>

<!-- 2. Gifts -->
<section class="screen wc" id="s-gifts">
  <div class="inner">
    <h1 class="big-title rv" id="giftsTitle"></h1>
    <p class="subtitle rv" style="--i:1" id="giftsSub"></p>
    <div class="gifts rv" style="--i:2" id="gifts"></div>
  </div>
</section>

<!-- 3. Bouquet -->
<section class="screen wc" id="s-bouquet">
  <div class="inner">
    <div class="deco lace tl"></div><div class="deco lace br"></div>
    <div class="deco bow tl">🎀</div><div class="deco bow br">🎀</div>
    <div class="deco hearts-bg" style="inset:0">
      <span style="left:4%;top:40%">♡</span><span style="left:30%;top:88%">♡</span><span style="right:5%;top:12%">♡</span>
      <span style="right:28%;top:90%">♡</span><span style="right:3%;top:55%">♡</span><span style="left:26%;top:8%">♡</span>
    </div>
    <div class="bq-head">
      <h2 class="page-title rv" id="bqTitle"></h2>
      <button class="btn-next back rv" style="--i:1"></button>
    </div>
    <div class="bq">
      <div class="notes left" id="notesL"></div>
      <div class="bq-card rv" style="--i:1">
        <svg class="frame" viewBox="0 0 300 420" preserveAspectRatio="none"><path id="wavy" fill="#fdf2ee" stroke="#e9a3b0" stroke-width="3"/></svg>
        <svg class="bouquet" id="bouquet" viewBox="0 0 300 400"></svg>
      </div>
      <div class="notes right" id="notesR"></div>
    </div>
  </div>
</section>

<!-- 4. Memory + song -->
<section class="screen" id="s-memory">
  <div class="inner">
    <div class="deco torn b"></div><div class="deco torn a"></div>
    <div class="deco tickets">
      <div class="ticket" style="--r:-8deg"><b>LOVE PASS</b><small>ADMIT ONE<br>TO MY HEART</small></div>
      <div class="ticket" style="--r:-3deg"><b>ROMANCE TICKET</b><small>SPECIAL DAY<br>NO. 5201314</small></div>
      <div class="ticket" style="--r:-9deg"><b>LOVE NOTE</b><small>KEEP THIS TICKET ♥</small></div>
    </div>
    <div class="deco flowers"><span style="font-size:1.35em">🌺</span><br>🌸🌷</div>
    <div class="deco butterfly">🦋</div>
    <button class="btn-next back"></button>
    <div class="photo-frame rv"><div class="photo" id="photo"></div></div>
    <div class="player rv" style="--i:2">
      <div class="p-video hidden" id="pVideo"><div id="ytFrame"></div></div>
      <div class="p-top">
        <div class="p-cover" id="pCover"></div>
        <div class="p-meta"><b id="pTitle"></b><span id="pArtist"></span><div class="p-bar" id="pBar"><i id="pFill"></i></div></div>
      </div>
      <div class="p-ctrl">
        <button id="pShuffle" class="dim" aria-label="shuffle"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2-3.2-3z"/></svg></button>
        <button id="pPrev" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button id="pPlay" class="play" aria-label="play"></button>
        <button id="pNext" aria-label="next"><svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <button id="pRepeat" aria-label="repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
      </div>
    </div>
  </div>
</section>

<!-- 5. Letter -->
<section class="screen" id="s-letter">
  <div class="inner">
    <svg class="deco branch" viewBox="0 0 60 320" aria-hidden="true">
      <path d="M34 0 Q14 60 32 120 Q50 180 30 240 Q20 280 34 320" fill="none" stroke="#a88080" stroke-width="2.5"/>
      <g font-size="26"><text x="14" y="40">🌸</text><text x="26" y="92">🌸</text><text x="8" y="140">🌸</text><text x="28" y="190">🌸</text><text x="10" y="240">🌸</text><text x="24" y="292">🌸</text></g>
    </svg>
    <h2 class="letter-title rv" id="lTitle"></h2>
    <div class="paper-wrap rv" style="--i:1"><div class="paper" id="paper"></div></div>
    <div class="let-foot">
      <div class="cat-heart rv" style="--i:2" id="catHeart"></div>
      <button class="btn-next back rv" style="--i:3"></button>
    </div>
  </div>
</section>

<audio id="audio" preload="auto"></audio>

<script>
const C = CONTENT;
const $ = id => document.getElementById(id);
const HEART = "M0 -3 C-4 -9 -12 -7 -12 0 C-12 6 -5 10 0 14 C5 10 12 6 12 0 C12 -7 4 -9 0 -3Z";

/* ---------- Navigation ---------- */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => {
    s.classList.toggle("active", s.id === id);
    if (s.id === id) s.scrollTop = 0;
  });
}
document.querySelectorAll(".btn-next").forEach(b => b.textContent = C.next);
document.querySelectorAll(".back").forEach(b => b.onclick = () => show("s-gifts"));

/* ---------- Cat drawing ---------- */
function catSVG(faces) {
  return `<svg class="cat" viewBox="0 -14 200 184" data-mood="neutral">
    <g class="c-stress ln"><path d="M70 14 L64 2"/><path d="M86 8 L84 -6"/><path d="M100 6 V-8"/><path d="M114 8 L116 -6"/><path d="M130 14 L136 2"/></g>
    <path d="M42 78 Q36 34 58 22 L80 46 Q100 40 120 46 L142 22 Q164 34 158 78 Q168 128 128 146 Q100 156 72 146 Q32 128 42 78Z" fill="#fff" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="130" cy="58" rx="16" ry="10" fill="#f6dfd2"/>
    <path class="c-shade" d="M47 74 Q45 46 60 32 L80 51 Q100 45 120 51 L140 32 Q155 46 153 74 Q100 62 47 74Z" fill="#c9c9c9" opacity=".75"/>
    <g fill="#f7c6c6"><ellipse cx="66" cy="104" rx="10" ry="7"/><ellipse cx="134" cy="104" rx="10" ry="7"/></g>
    ${faces}
  </svg>`;
}
const W_MOUTH = `<path class="ln" d="M90 102 Q95 109 100 102 Q105 109 110 102"/>`;
const FACES = {
  neutral: `<g class="f f-neutral" fill="#2b2b2b"><circle cx="80" cy="90" r="6"/><circle cx="120" cy="90" r="6"/>${W_MOUTH}</g>`,
  cry: `<g class="f f-cry"><rect x="70" y="94" width="16" height="54" rx="8" fill="#8fd3f7"/><rect x="114" y="94" width="16" height="54" rx="8" fill="#8fd3f7"/>
        <g fill="#111"><circle cx="78" cy="88" r="12"/><circle cx="122" cy="88" r="12"/></g><g fill="#fff"><circle cx="82" cy="84" r="3.5"/><circle cx="126" cy="84" r="3.5"/></g>${W_MOUTH}</g>`,
  grumpy: `<g class="f f-grumpy"><path class="ln" d="M64 86 L94 90"/><path class="ln" d="M106 90 L136 86"/>
        <g fill="#2b2b2b"><path d="M72 89 a8 6 0 0 0 16 1Z"/><path d="M112 90 a8 6 0 0 0 16 -1Z"/></g>${W_MOUTH}</g>`,
  sad: `<g class="f f-sad"><path class="ln" d="M66 90 Q78 78 90 90"/><path class="ln" d="M110 90 Q122 78 134 90"/>
        <g fill="#2b2b2b"><circle cx="78" cy="93" r="4"/><circle cx="122" cy="93" r="4"/></g>
        <g fill="#8fd3f7"><ellipse cx="68" cy="100" rx="6" ry="5"/><ellipse cx="132" cy="100" rx="6" ry="5"/></g>
        <path class="ln" d="M93 110 Q100 103 107 110"/></g>`,
  happy: `<g class="f f-happy"><path class="ln" d="M68 92 L80 84 L92 92"/><path class="ln" d="M108 92 L120 84 L132 92"/>
        <path d="M90 100 Q100 124 110 100Z" fill="#e8667f" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
        <path class="ln" d="M76 138 q-4 -16 12 -18"/><path class="ln" d="M124 138 q4 -16 -12 -18"/></g>`,
};
$("catHolder").innerHTML = catSVG(Object.values(FACES).join(""));
$("catHeart").innerHTML = catSVG(FACES.happy.replace('class="f f-happy"', "") +
  `<path d="${HEART}" transform="translate(100 118) scale(2.3)" fill="#e8475f" stroke="#2b2b2b" stroke-width="1.8"/>`);
const cat = $("catHolder").querySelector(".cat");

/* ---------- 1. Love meter ---------- */
const P = (r, a) => `${(150 + r * Math.cos(a)).toFixed(1)} ${(150 - r * Math.sin(a)).toFixed(1)}`;
$("segs").innerHTML = ["#f8dbe0", "#f5bfca", "#f0a3b5", "#e2678a", "#cb2f5b", "#a80a37"].map((c, i) => {
  const a1 = Math.PI - i * Math.PI / 6, a2 = Math.PI - (i + 1) * Math.PI / 6;
  return `<path d="M${P(140, a1)} A140 140 0 0 1 ${P(140, a2)} L${P(80, a2)} A80 80 0 0 0 ${P(80, a1)}Z" fill="${c}" stroke="#fdeef0" stroke-width="2"/>`;
}).join("") +
  `<path d="${HEART}" transform="translate(43.7 119) scale(.95)" fill="none" stroke="#fdf3f5" stroke-width="2.4"/>
   <path d="${HEART}" transform="translate(256.3 119) scale(.95)" fill="none" stroke="#fff" stroke-width="2.4"/>`;

$("burst").innerHTML = [[4, 20], [14, 70], [2, 55], [88, 18], [80, 72], [93, 50]].map(([x, y], i) =>
  `<svg viewBox="-13 -10 26 26" style="left:${x}%;top:${y}%;animation-delay:${i * .2}s"><path d="${HEART}" fill="${i % 2 ? "#f36b86" : "#e8475f"}"/></svg>`
).join("");

let lastMood = "", nextTimer = null;
function setMeter(v) {
  const p = v <= 100 ? v : v >= 110 ? Infinity : 100 + (v - 100) * 100;
  const [mood, text] = p === 0 ? ["neutral", C.meter.question] : p < 30 ? ["cry", C.meter.low] :
    p < 50 ? ["grumpy", C.meter.mid] : p < 100 ? ["sad", C.meter.half] : ["happy", C.meter.correct];
  if (mood !== lastMood) {
    cat.dataset.mood = mood;
    cat.classList.remove("pop"); void cat.getBoundingClientRect(); cat.classList.add("pop");
    lastMood = mood;
  }
  $("moodText").textContent = text;
  $("burst").classList.toggle("on", mood === "happy");
  $("needle").setAttribute("transform", `rotate(${Math.min(p, 100) * 1.8} 150 150)`);
  clearTimeout(nextTimer);
  $("pct").classList.remove("hidden");
  $("meterNext").classList.add("hidden");
  $("pct").textContent = p === Infinity ? "∞" : p + "%";
  if (p === Infinity) nextTimer = setTimeout(() => {
    $("pct").classList.add("hidden");
    $("meterNext").classList.remove("hidden");
  }, 900);
}
$("slider").oninput = e => setMeter(+e.target.value);
$("meterNext").onclick = () => show("s-gifts");
setMeter(0);

/* ---------- 2. Gifts ---------- */
$("giftsTitle").textContent = C.giftsTitle;
$("giftsSub").textContent = C.giftsSubtitle;
const GIFT = `<svg viewBox="0 0 200 210">
  <g stroke="#6fa9d2" stroke-width="2.5" stroke-linejoin="round">
    <path d="M30 104 H142 V196 H30Z" fill="#aad8f3"/>
    <path d="M142 104 L172 90 V182 L142 196Z" fill="#8ec5ea"/>
    <path d="M22 84 H150 V108 H22Z" fill="#bfe3f7"/>
    <path d="M150 84 L180 70 V94 L150 108Z" fill="#a3d2ee"/>
    <path d="M22 84 L52 70 H180 L150 84Z" fill="#d6eefb"/>
  </g>
  <g fill="#f6aabb" stroke="#e58aa0" stroke-width="2" stroke-linejoin="round">
    <path d="M76 84 H96 V196 H76Z"/><path d="M76 84 L106 70 H126 L96 84Z"/>
    <path d="M142 144 L172 130 V142 L142 156Z"/><path d="M150 90 L180 76 V84 L150 98Z"/>
  </g>
  <g fill="#f7b6c4" stroke="#e2879e" stroke-width="2.5" stroke-linejoin="round">
    <path d="M96 76 L80 112 L89 108 L93 118 L102 78Z"/><path d="M106 76 L122 110 L114 107 L109 117 L100 78Z"/>
    <path d="M101 72 C76 40 42 46 50 70 C56 88 84 84 101 72Z"/><path d="M101 72 C126 40 160 46 152 70 C146 88 118 84 101 72Z"/>
    <ellipse cx="101" cy="73" rx="11" ry="9" fill="#f39db2"/>
  </g>
  <g fill="#fff" opacity=".85"><circle cx="66" cy="60" r="2.4"/><circle cx="78" cy="72" r="2.4"/><circle cx="60" cy="74" r="2.4"/>
    <circle cx="136" cy="60" r="2.4"/><circle cx="124" cy="72" r="2.4"/><circle cx="142" cy="74" r="2.4"/></g>
</svg>`;
$("gifts").innerHTML = ["s-bouquet", "s-memory", "s-letter"].map((to, i) =>
  `<button class="gift" data-to="${to}" style="--d:${i * .4}s" aria-label="gift ${i + 1}">${GIFT}</button>`
).join("");
document.querySelectorAll(".gift").forEach(g => g.onclick = () => {
  g.classList.add("opening");
  if (g.dataset.to === "s-memory") media.play();
  setTimeout(() => {
    show(g.dataset.to);
    g.classList.remove("opening");
    g.classList.add("opened");
  }, 450);
});

/* ---------- 3. Bouquet ---------- */
$("bqTitle").textContent = C.bouquetTitle;
const note = (t, i) => { const d = document.createElement("div"); d.className = "note rv"; d.style.setProperty("--i", i + 2); d.textContent = t; return d; };
C.bouquetNotes.forEach((t, i) => $(i < 3 ? "notesL" : "notesR").appendChild(note(t, i)));

(function wavyFrame() {
  const pts = [], amp = 5, m = 8;
  const edge = (x0, y0, x1, y1, nx, ny) => {
    const len = Math.hypot(x1 - x0, y1 - y0), waves = Math.round(len / 28);
    for (let s = 0; s < len; s += 3) {
      const t = s / len, o = amp * Math.sin(t * waves * 2 * Math.PI);
      pts.push(`${(x0 + (x1 - x0) * t + nx * o).toFixed(1)} ${(y0 + (y1 - y0) * t + ny * o).toFixed(1)}`);
    }
  };
  edge(m, m, 300 - m, m, 0, -1); edge(300 - m, m, 300 - m, 420 - m, 1, 0);
  edge(300 - m, 420 - m, m, 420 - m, 0, 1); edge(m, 420 - m, m, m, -1, 0);
  $("wavy").setAttribute("d", "M" + pts.join(" L") + "Z");
})();

$("bouquet").innerHTML = `
  <defs><symbol id="rose" viewBox="-24 -24 48 48">
    <circle r="21" fill="#d9363e" stroke="#9e1b28" stroke-width="1.5"/>
    <g fill="none" stroke="#a01d2a" stroke-width="2.4" stroke-linecap="round">
      <path d="M-15 -5 Q-5 -20 12 -11 Q20 2 8 14 Q-6 20 -15 6"/><path d="M-8 -2 Q0 -12 8 -4 Q10 6 0 8 Q-6 6 -6 0"/><path d="M-2 0 Q2 -4 3 1"/>
    </g></symbol></defs>
  <path d="M30 140 Q150 92 270 140 L176 300 H124Z" fill="#faf4ef" stroke="#d8ccc4" stroke-width="2"/>
  <g fill="#8fb56a" stroke="#6b8f4a" stroke-width="1.5">
    <ellipse cx="46" cy="150" rx="24" ry="10" transform="rotate(-30 46 150)"/><ellipse cx="254" cy="150" rx="24" ry="10" transform="rotate(30 254 150)"/>
    <ellipse cx="66" cy="92" rx="20" ry="8" transform="rotate(-55 66 92)"/><ellipse cx="234" cy="92" rx="20" ry="8" transform="rotate(55 234 92)"/>
  </g>
  ${[[60, [105, 150, 195]], [95, [85, 128, 172, 215]], [130, [62, 106, 150, 194, 238]], [162, [85, 128, 172, 215]]]
    .flatMap(([y, xs]) => xs.map(x => `<use href="#rose" x="${x - 24}" y="${y - 24}" width="48" height="48"/>`)).join("")}
  <path d="M40 165 Q95 214 150 222 Q205 214 260 165 L178 300 H122Z" fill="#fffdfb" stroke="#d8ccc4" stroke-width="2"/>
  <path d="M150 224 V298 M102 206 L130 296 M198 206 L170 296" stroke="#ebe1da" stroke-width="2" fill="none"/>
  <g stroke="#d9363e" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M146 294 C130 330 152 350 130 390"/><path d="M154 294 C170 330 148 356 172 392"/>
  </g>
  <g fill="#e2474e" stroke="#a31d2a" stroke-width="2" stroke-linejoin="round">
    <path d="M150 290 C124 262 102 276 116 294 C124 304 142 298 150 290Z"/><path d="M150 290 C176 262 198 276 184 294 C176 304 158 298 150 290Z"/>
    <ellipse cx="150" cy="291" rx="9" ry="8"/>
  </g>`;

/* ---------- 4. Memory + song ---------- */
const photos = C.photos.length ? C.photos : [""];
$("photo").innerHTML = photos.map((src, i) =>
  `<div class="slide${i ? "" : " on"}" style="background:url('${encodeURI(src)}') center/cover no-repeat, var(--sky)"></div>`
).join("");
if (photos.length > 1) {
  let cur = 0;
  const slides = $("photo").children;
  setInterval(() => {
    slides[cur].classList.remove("on");
    cur = (cur + 1) % slides.length;
    slides[cur].classList.add("on");
  }, 3500);
}

$("pTitle").textContent = C.song.title;
$("pArtist").textContent = C.song.artist;
const ytThumb = C.song.youtube ? `url('https://i.ytimg.com/vi/${encodeURIComponent(C.song.youtube)}/hqdefault.jpg') center/cover no-repeat, ` : "";
$("pCover").style.background = `url('${encodeURI(C.song.cover)}') center/cover no-repeat, ${ytThumb}linear-gradient(135deg, #1d3557, #6b9ac4)`;
const ICON_PLAY = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
const ICON_PAUSE = `<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>`;
let loop = true, media = null;
const syncPlay = () => $("pPlay").innerHTML = media && !media.paused() ? ICON_PAUSE : ICON_PLAY;
const setProgress = f => $("pFill").style.width = f * 100 + "%";

/* mp3 файл (song.file) */
function audioMedia(src) {
  const a = $("audio");
  a.src = src;
  a.loop = true;
  a.onplay = a.onpause = syncPlay;
  a.ontimeupdate = () => { if (a.duration) setProgress(a.currentTime / a.duration); };
  return {
    play: () => a.play().catch(() => {}),
    pause: () => a.pause(),
    paused: () => a.paused,
    seek: f => { if (a.duration) a.currentTime = f * a.duration; },
    setLoop: v => { a.loop = v; },
  };
}

/* YouTube бичлэг (song.youtube) — тоглуулагч дотор жижиг бичлэгээр харагдана */
function youtubeMedia(id) {
  let yt = null, wantPlay = false, playing = false;
  $("pVideo").classList.remove("hidden");
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player("ytFrame", {
      videoId: id,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => { if (wantPlay) yt.playVideo(); },
        onStateChange: e => {
          playing = e.data === YT.PlayerState.PLAYING;
          if (e.data === YT.PlayerState.ENDED && loop) { yt.seekTo(0, true); yt.playVideo(); }
          syncPlay();
        },
      },
    });
  };
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
  const ready = () => yt && typeof yt.getDuration === "function";
  setInterval(() => { if (ready() && yt.getDuration()) setProgress(yt.getCurrentTime() / yt.getDuration()); }, 500);
  return {
    play: () => { wantPlay = true; if (ready()) yt.playVideo(); },
    pause: () => { wantPlay = false; if (ready()) yt.pauseVideo(); },
    paused: () => !playing,
    seek: f => { if (ready() && yt.getDuration()) yt.seekTo(f * yt.getDuration(), true); },
    setLoop: () => {},
  };
}

media = C.song.youtube ? youtubeMedia(C.song.youtube) : audioMedia(C.song.file);
syncPlay();
$("pPlay").onclick = () => media.paused() ? media.play() : media.pause();
$("pBar").onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  media.seek((e.clientX - r.left) / r.width);
};
$("pPrev").onclick = $("pNext").onclick = () => media.seek(0);
$("pRepeat").onclick = e => { loop = !loop; media.setLoop(loop); e.currentTarget.classList.toggle("dim", !loop); };
$("pShuffle").onclick = e => e.currentTarget.classList.toggle("dim");

/* ---------- 5. Letter ---------- */
$("lTitle").textContent = C.letterTitle;
C.letter.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("paper").appendChild(p); });
if (C.letterSign) {
  const sign = document.createElement("p");
  sign.className = "sign";
  sign.textContent = C.letterSign;
  $("paper").appendChild(sign);
}

/* index.html#s-letter гэх мэтээр шууд тухайн дэлгэцийг нээж шалгана */
if (location.hash && $(location.hash.slice(1))?.classList.contains("screen")) show(location.hash.slice(1));
</script>
</body>
